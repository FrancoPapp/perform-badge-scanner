name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject DT credentials
        run: |
          sed -i "s|__DT_TENANT__|${{ secrets.DT_TENANT }}|g" docs/index.html
          sed -i "s|__DT_TOKEN__|${{ secrets.DT_TOKEN }}|g"   docs/index.html

      - name: Deploy to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd docs
          git init -b gh-pages
          git add -A
          git commit -m "deploy"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
