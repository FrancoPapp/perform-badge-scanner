name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject DT credentials
        run: |
          sed -i "s|__DT_TENANT__|${{ secrets.DT_TENANT }}|g" docs/index.html
          sed -i "s|__DT_TOKEN__|${{ secrets.DT_TOKEN }}|g"   docs/index.html

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          clean: true
